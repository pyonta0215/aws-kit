# 外部アクションは四半期に1回、1本の PR にまとめて更新する（コミット SHA で固定している分）。
# 公開から7日たっていない版は待ち、メジャー更新は自動では出さない。
# npm の定期更新はしない。脆弱性のある依存は、リポジトリ設定のセキュリティ更新が別に PR を作る。
# npm の項目は aws-kit の ignore を効かせるために残している。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # メジャー更新は壊れうるので自動では出さない。必要になったら個別に上げる
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directories:
      - /
    # 定期更新はしない。セキュリティ更新はこの上限と関係なく届く
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
    ignore:
      # GitHub 参照の自作パッケージ。Dependabot は npm レジストリで探して失敗するため、手で上げる
      - dependency-name: "@pyonta0215/aws-kit"
