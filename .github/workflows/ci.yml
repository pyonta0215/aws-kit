name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        aws-jwt-verify: ['4.0.1', '5']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save aws-jwt-verify@${{ matrix.aws-jwt-verify }}
      - run: npm run typecheck
      - run: npm test
      - name: dist がソースと一致しているか
        run: npm run build && git diff --exit-code -- dist
